<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{margin:0;padding:0;background:#0C0C0C;color:#F0EDE8;font-family:'Outfit',sans-serif;overflow-x:hidden;cursor:none;}
    ::-webkit-scrollbar{width:3px;}
    ::-webkit-scrollbar-track{background:#0C0C0C;}
    ::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px;}

    /* Custom Cursor */
    #cursor-dot{position:fixed;width:8px;height:8px;border-radius:50%;background:#FF4757;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);transition:width .15s,height .15s,background .2s;}
    #cursor-ring{position:fixed;width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(255,71,87,.5);pointer-events:none;z-index:99998;transform:translate(-50%,-50%);transition:width .3s,height .3s,border-color .3s,transform .1s;}
    body.cursor-hover #cursor-dot{width:12px;height:12px;background:#FF4757;}
    body.cursor-hover #cursor-ring{width:52px;height:52px;border-color:rgba(255,71,87,.8);}

    @keyframes fadeInUp{from{opacity:0;transform:translateY(40px);}to{opacity:1;transform:translateY(0);}}
    @keyframes fadeInLeft{from{opacity:0;transform:translateX(-40px);}to{opacity:1;transform:translateX(0);}}
    @keyframes fadeInRight{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:translateX(0);}}
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
    @keyframes ticker{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
    @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
    @keyframes rotate{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
    @keyframes blob1{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(40px,-50px) scale(1.1);}66%{transform:translate(-30px,30px) scale(0.9);}}
    @keyframes blob2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-40px,40px) scale(1.12);}}
    @keyframes shimmer{0%{background-position:-1000px 0;}100%{background-position:1000px 0;}}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,71,87,.4);}50%{box-shadow:0 0 0 8px rgba(255,71,87,0);}}
    @keyframes borderSpin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
    @keyframes scaleIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
    @keyframes slideDown{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
    @keyframes progressFill{from{width:0;}to{width:var(--w);}}
  </style>
  <script type="module" crossorigin src="/assets/index-1ba2e566.js"></script>
</head>
<body>
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>
  <div id="root"></div>
  
  <script>
    // Custom cursor
    let mx=0,my=0,rx=0,ry=0;
    const dot=document.getElementById('cursor-dot');
    const ring=document.getElementById('cursor-ring');
    document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
    function animRing(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(animRing);}
    animRing();
    document.addEventListener('mouseover',e=>{if(e.target.closest('a,button,[data-cursor]'))document.body.classList.add('cursor-hover');});
    document.addEventListener('mouseout',e=>{if(e.target.closest('a,button,[data-cursor]'))document.body.classList.remove('cursor-hover');});
  </script>
</body>
</html>
